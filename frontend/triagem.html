<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Triagem - Sentinela Kids</title>

    <style>* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            135deg,
            #e9f8ff,
            #f3efff,
            #eafff5
        );

    color: #29374d;

    padding: 25px;
}

.container {
    max-width: 720px;

    margin: auto;
}

.header {
    display: flex;

    align-items: center;

    gap: 17px;

    margin-bottom: 25px;
}

.header-icon {
    width: 65px;
    height: 65px;

    border-radius: 20px;

    background: #e0f3ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
}

.header span {
    color: #6380db;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1px;
}

.header h1 {
    margin-top: 4px;

    font-size: 28px;
}

.header p {
    color: #7e8999;

    margin-top: 5px;

    font-size: 14px;
}

.card {
    background: white;

    border-radius: 25px;

    padding: 28px;

    box-shadow:
        0 15px 40px rgba(57, 79, 110, 0.12);
}

.card-title {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 22px;
}

.card-title h2 {
    color: #475fd0;

    font-size: 20px;
}

.card-title span {
    background: #eef1ff;

    color: #6374d1;

    padding: 7px 12px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: bold;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: bold;

    color: #566276;
}

input,
select,
textarea {
    width: 100%;

    padding: 14px;

    border-radius: 14px;

    border: 2px solid #e6ebf1;

    background: #fafcfe;

    outline: none;

    font-family: inherit;

    font-size: 14px;
}

textarea {
    min-height: 110px;

    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #7792ed;

    background: white;
}

.save-button {
    width: 100%;

    border: none;

    border-radius: 16px;

    padding: 16px;

    background:
        linear-gradient(
            135deg,
            #6389f0,
            #8069db
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.resultado {
    display: none;

    padding: 15px;

    margin-bottom: 18px;

    border-radius: 15px;

    text-align: center;
}

.resultado.verde {
    display: block;

    background: #e4f9ed;

    color: #258253;
}

.resultado.amarelo {
    display: block;

    background: #fff6d8;

    color: #9a7410;
}

.resultado.vermelho {
    display: block;

    background: #ffe5e5;

    color: #c63c3c;
}

footer {
    text-align: center;

    margin-top: 25px;

    font-size: 12px;

    color: #8995a6;
}

@media(max-width:600px) {

    body {
        padding: 15px;
    }

    .card {
        padding: 20px;
    }

    .header h1 {
        font-size: 22px;
    }

}</style>
</head>

<body>

    <main class="container">

        <header class="header">

            <div class="header-icon">
                🩺
            </div>

            <div>

                <span>TRIAGEM</span>

                <h1>
                    Avaliação do paciente
                </h1>

                <p>
                    Registre os sintomas e informações iniciais.
                </p>

            </div>

        </header>

        <section class="card">

            <div class="card-title">
                <h2>🧸 Informações da triagem</h2>
                <span>Passo 1</span>
            </div>

            <div class="field">

                <label for="nome">
                    Nome do paciente
                </label>

                <input
                    id="nome"
                    type="text"
                    placeholder="Nome completo"
                >

            </div>

            <div class="field">

                <label for="sintoma">
                    Sintoma principal
                </label>

                <select id="sintoma">

                    <option value="">
                        Selecione o sintoma
                    </option>

                    <option value="dor_leve">
                        Dor leve
                    </option>

                    <option value="resfriado">
                        Resfriado
                    </option>

                    <option value="coriza">
                        Coriza
                    </option>

                    <option value="tosse">
                        Tosse
                    </option>

                    <option value="febre">
                        Febre
                    </option>

                    <option value="dor_cabeca">
                        Dor de cabeça
                    </option>

                    <option value="dor_garganta">
                        Dor de garganta
                    </option>

                    <option value="fadiga">
                        Fadiga
                    </option>

                    <option value="enjoo">
                        Enjoo
                    </option>

                    <option value="falta_ar">
                        Falta de ar
                    </option>

                    <option value="tontura">
                        Tontura
                    </option>

                    <option value="calafrios">
                        Calafrios
                    </option>

                    <option value="espirros">
                        Espirros
                    </option>

                    <option value="dor_muscular">
                        Dor muscular
                    </option>

                    <option value="dor_articulacao">
                        Dor nas articulações
                    </option>

                    <option value="azia">
                        Azia
                    </option>

                    <option value="vomito">
                        Vômito
                    </option>

                    <option value="diarreia">
                        Diarreia
                    </option>

                    <option value="prisao_ventre">
                        Prisão de ventre
                    </option>

                    <option value="coceira">
                        Coceira
                    </option>

                    <option value="alergia">
                        Alergia
                    </option>

                    <option value="pele_irritada">
                        Pele irritada
                    </option>

                    <option value="olhos_vermelhos">
                        Olhos vermelhos
                    </option>

                    <option value="lacrimejamento">
                        Lacrimejamento
                    </option>

                    <option value="perda_apetite">
                        Perda de apetite
                    </option>

                    <option value="insonia">
                        Insônia
                    </option>

                    <option value="ansiedade">
                        Ansiedade
                    </option>

                    <option value="pressao_alta">
                        Pressão alta
                    </option>

                    <option value="pressao_baixa">
                        Pressão baixa
                    </option>

                    <option value="palpitacao">
                        Palpitação
                    </option>

                    <option value="dor_peito">
                        Dor no peito
                    </option>

                    <option value="infarto">
                        Suspeita de infarto
                    </option>

                    <option value="avc">
                        Suspeita de AVC
                    </option>

                    <option value="convulsão">
                        Convulsão
                    </option>

                    <option value="hemorragia">
                        Hemorragia
                    </option>

                    <option value="falta_ar_grave">
                        Falta de ar grave
                    </option>

                </select>

            </div>

            <div class="field">

                <label for="temp">
                    Temperatura
                </label>

                <input
                    id="temp"
                    type="number"
                    step="0.1"
                    placeholder="Ex.: 37.5"
                >

            </div>

            <div class="field">

                <label for="alergias">
                    Alergias
                </label>

                <input
                    id="alergias"
                    type="text"
                    placeholder="Informe se houver"
                >

            </div>

            <div class="field">

                <label for="observacao">
                    Observações
                </label>

                <textarea
                    id="observacao"
                    placeholder="Digite outras informações importantes..."
                ></textarea>

            </div>

            <div
                id="resultado"
                class="resultado"
            ></div>

            <button
                onclick="salvar()"
                class="save-button"
            >
                Salvar triagem 💙
            </button>

        </section>

        <footer>
            Sentinela Kids • Triagem Hospitalar
        </footer>

    </main>

    <script>

        function classificarRisco(
            sintoma,
            temperatura
        ) {

            const vermelhos = [
                "infarto",
                "avc",
                "convulsão",
                "hemorragia",
                "falta_ar_grave"
            ];

            const amarelos = [
                "febre",
                "vomito",
                "diarreia",
                "falta_ar",
                "tontura",
                "dor_peito",
                "pressao_alta",
                "pressao_baixa",
                "palpitacao"
            ];

            if (
                vermelhos.includes(sintoma)
            ) {

                return "vermelho";

            }

            if (
                !isNaN(temperatura) &&
                temperatura >= 39
            ) {

                return "vermelho";

            }

            if (
                amarelos.includes(sintoma)
            ) {

                return "amarelo";

            }

            if (
                !isNaN(temperatura) &&
                temperatura >= 38
            ) {

                return "amarelo";

            }

            return "verde";

        }


        async function salvar() {

            const nome =
                document
                    .getElementById("nome")
                    .value
                    .trim();

            const sintoma =
                document
                    .getElementById("sintoma")
                    .value;

            const temperaturaInput =
                document
                    .getElementById("temp")
                    .value;

            const temperatura =
                temperaturaInput === ""
                    ? null
                    : Number(temperaturaInput);

            const alergias =
                document
                    .getElementById("alergias")
                    .value
                    .trim();

            const observacao =
                document
                    .getElementById("observacao")
                    .value
                    .trim();

            if (!nome) {

                alert(
                    "Digite o nome do paciente."
                );

                return;

            }

            if (!sintoma) {

                alert(
                    "Selecione o sintoma principal."
                );

                return;

            }

            const risco =
                classificarRisco(
                    sintoma,
                    temperatura
                );

            const resultado =
                document.getElementById(
                    "resultado"
                );

            resultado.className =
                "resultado " + risco;

            resultado.innerHTML = `
                <strong>Classificação:</strong>
                ${risco.toUpperCase()}
            `;

            try {

                const response =
                    await fetch("/triagem", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            nome,
                            sintoma,
                            temperatura,
                            alergias,
                            observacao,
                            risco

                        })

                    });

                const data =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.erro ||
                        "Erro ao salvar triagem."
                    );

                }

                alert(
                    "✓ Triagem salva com sucesso!"
                );

                document
                    .getElementById("nome")
                    .value = "";

                document
                    .getElementById("sintoma")
                    .value = "";

                document
                    .getElementById("temp")
                    .value = "";

                document
                    .getElementById("alergias")
                    .value = "";

                document
                    .getElementById("observacao")
                    .value = "";

            } catch (error) {

                console.error(error);

                alert(
                    "Erro ao conectar com o servidor.\n\n" +
                    error.message
                );

            }

        }

    </script>

</body>

</html>
