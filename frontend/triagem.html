<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem Hospitalar</title>
    <link rel="stylesheet" href="css/triagem.css">
</head>
<body>

    <div class="container">

        <h2>Triagem Hospitalar</h2>
        
        <input id="nome" placeholder="Nome completo do paciente">

        <select id="sintoma">
            <option value="">Selecione o sintoma principal</option>
            <option value="dor_leve">Dor leve</option>
            <option value="resfriado">Resfriado</option>
            <option value="coriza">Coriza</option>
            <option value="tosse">Tosse</option>
            <option value="febre">Febre</option>
            <option value="dor_cabeca">Dor de cabeça</option>
            <option value="dor_garganta">Dor de garganta</option>
            <option value="fadiga">Fadiga</option>
            <option value="enjoo">Enjoo</option>
            <option value="falta_ar">Falta de ar</option>
            <option value="tontura">Tontura</option>
            <option value="calafrios">Calafrios</option>
            <option value="espirros">Espirros</option>
            <option value="dor_muscular">Dor muscular</option>
            <option value="dor_articulacao">Dor nas articulações</option>
            <option value="azia">Azia</option>
            <option value="vomito">Vômito</option>
            <option value="diarreia">Diarreia</option>
            <option value="prisao_ventre">Prisão de ventre</option>
            <option value="coceira">Coceira</option>
            <option value="alergia">Alergia</option>
            <option value="pele_irritada">Pele irritada</option>
            <option value="olhos_vermelhos">Olhos vermelhos</option>
            <option value="lacrimejamento">Lacrimejamento</option>
            <option value="perda_apetite">Perda de apetite</option>
            <option value="insonia">Insônia</option>
            <option value="ansiedade">Ansiedade</option>
            <option value="pressao_alta">Pressão alta</option>
            <option value="pressao_baixa">Pressão baixa</option>
            <option value="palpitacao">Palpitação</option>
            <option value="dor_peito">Dor no peito</option>
            <option value="infarto">Dor no peito / Suspeita de Infarto</option>
            <option value="avc">Suspeita de AVC</option>
            <option value="convulsão">Convulsão</option>
            <option value="hemorragia">Hemorragia</option>
            <option value="falta_ar_grave">Falta de ar grave</option>
        </select>

        <input type="number" id="temp" placeholder="Temperatura (°C)" step="0.1">

        <input placeholder="Alergias (se houver)" id="alergias">

        <textarea id="observação" placeholder="Observações médicas adicionais..."></textarea>

        <div id="resultado"></div>

        <button onclick="salvar()">Salvar Triagem</button>
    </div>

<script>
    function classificarRisco(sintoma, temperatura) {

        const vermelhos = [
            "infarto",
            "avc",
            "convulsão",
            "hemorragia",
            "falta_ar_grave"
        ];

        const amarelos = [
            "febre",
            "vomito",
            "diarreia",
            "falta_ar",
            "tontura",
            "dor_peito",
            "pressao_alta",
            "pressao_baixa",
            "palpitacao"
        ];

        // Situações graves
        if (vermelhos.includes(sintoma)) {
            return "vermelho";
        }

        // Febre muito alta
        if (temperatura >= 39) {
            return "vermelho";
        }

        // Situações de atenção
        if (amarelos.includes(sintoma)) {
            return "amarelo";
        }

        // Temperatura elevada
        if (temperatura >= 38) {
            return "amarelo";
        }

        return "verde";
    }


    async function salvar() {

        const nome =
            document.getElementById("nome").value.trim();

        const sintoma =
            document.getElementById("sintoma").value;

        const temperatura =
            Number(document.getElementById("temp").value);

        const alergias =
            document.getElementById("alergias").value.trim();

        const observacao =
            document.getElementById("observação").value.trim();


        // Validação
        if (!nome) {
            alert("Digite o nome do paciente.");
            return;
        }

        if (!sintoma) {
            alert("Selecione o sintoma principal.");
            return;
        }


        const risco =
            classificarRisco(
                sintoma,
                temperatura
            );


        try {

            const response =
                await fetch("/triagem", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        nome: nome,

                        sintoma: sintoma,

                        temperatura: temperatura,

                        alergias: alergias,

                        observacao: observacao,

                        risco: risco

                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.erro ||
                    "Erro ao salvar a triagem."
                );

            }


            const resultado =
                document.getElementById("resultado");


            resultado.className =
                risco;


            resultado.innerHTML =
                "Classificação de Risco: " +
                risco.toUpperCase();


            alert(
                "Triagem salva com sucesso!"
            );


            // Limpa o formulário

            document.getElementById("nome").value = "";

            document.getElementById("sintoma").value = "";

            document.getElementById("temp").value = "";

            document.getElementById("alergias").value = "";

            document.getElementById("observação").value = "";


        } catch (error) {

            console.error(
                "Erro ao salvar triagem:",
                error
            );


            alert(
                "Erro ao conectar com o servidor.\n\n" +
                error.message
            );

        }

    }
</script>
</body>
</html>
