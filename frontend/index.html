
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Hospital</title>

    <link
        rel="stylesheet"
        href="css/index.css"
    >

</head>

<body>

    <div class="container">

        <h2>Sistema Hospitalar</h2>

        <input
            type="text"
            id="usuario"
            placeholder="Usuário"
        >

        <input
            type="password"
            id="senha"
            placeholder="Senha"
        >

        <button onclick="login()">
            Entrar
        </button>

    </div>


    <script>

        function login() {

            const usuario =
                document
                    .getElementById("usuario")
                    .value
                    .trim();

            const senha =
                document
                    .getElementById("senha")
                    .value
                    .trim();


            // Verifica os campos

            if (!usuario || !senha) {

                alert(
                    "Digite o usuário e a senha."
                );

                return;
            }


            fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    usuario: usuario,
                    senha: senha

                })

            })


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Usuário ou senha inválidos"
                    );

                }

                return response.json();

            })


            .then(data => {

                console.log(
                    "Login realizado:",
                    data
                );


                // ============================
                // REDIRECIONAMENTO
                // ============================

                if (data.tipo === "triagem") {

                    window.location.href =
                        "/triagem.html";

                }

                else if (data.tipo === "medico") {

                    window.location.href =
                        "/medico.html";

                }

                else if (data.tipo === "atendimento") {

                    window.location.href =
                        "/atendimento.html";

                }

                else {

                    alert(
                        "Tipo de usuário não reconhecido."
                    );

                }

            })


            .catch(error => {

                console.error(
                    "Erro no login:",
                    error
                );

                alert(
                    error.message
                );

            });

        }

    </script>

</body>

</html>
