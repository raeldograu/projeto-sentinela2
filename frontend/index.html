<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentinela Kids - Login</title>

<style>* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #e8f7ff,
            #f4efff,
            #eafff5
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow: hidden;

    color: #26344a;
}

.background-decoration {
    position: fixed;

    font-size: 70px;

    opacity: 0.08;

    pointer-events: none;
}

.decoration-1 {
    top: 8%;
    left: 8%;
    color: #4d8cff;
}

.decoration-2 {
    top: 15%;
    right: 10%;
    color: #ff6fa8;
}

.decoration-3 {
    bottom: 10%;
    left: 12%;
    color: #49c78b;
}

.decoration-4 {
    bottom: 15%;
    right: 8%;
    color: #8b6cff;
}

.login-container {
    width: 100%;
    max-width: 430px;

    background: rgba(255,255,255,0.96);

    border-radius: 30px;

    padding: 38px;

    box-shadow:
        0 20px 60px rgba(54, 83, 120, 0.15);

    border: 2px solid rgba(255,255,255,0.8);

    position: relative;

    z-index: 2;
}

.logo {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 15px;

    margin-bottom: 30px;
}

.logo-icon {
    width: 65px;
    height: 65px;

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;

    background: #e5f3ff;

    box-shadow:
        0 8px 20px rgba(66, 148, 220, 0.15);
}

.logo h1 {
    font-size: 30px;

    color: #4267d5;

    line-height: 1;
}

.logo span {
    color: #7c8798;

    font-size: 14px;

    font-weight: bold;
}

.welcome {
    text-align: center;

    margin-bottom: 25px;
}

.welcome h2 {
    font-size: 26px;

    margin-bottom: 8px;

    color: #293a59;
}

.welcome p {
    color: #78869a;

    font-size: 14px;

    line-height: 1.5;
}

.form label {
    display: block;

    font-size: 14px;

    font-weight: bold;

    margin: 15px 0 7px;

    color: #45536b;
}

.input-box {
    display: flex;

    align-items: center;

    gap: 10px;

    background: #f6f9fc;

    border: 2px solid #e5ebf2;

    border-radius: 15px;

    padding: 0 15px;

    transition: 0.2s;
}

.input-box:focus-within {
    border-color: #6c8ff5;

    background: white;

    box-shadow:
        0 0 0 4px rgba(108,143,245,0.1);
}

.input-box span {
    font-size: 18px;
}

.input-box input {
    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    padding: 15px 5px;

    font-size: 15px;

    color: #26344a;
}

button {
    width: 100%;

    border: none;

    border-radius: 16px;

    padding: 16px;

    margin-top: 25px;

    background:
        linear-gradient(
            135deg,
            #6388f3,
            #8069df
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(91,112,220,0.25);

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 12px 25px rgba(91,112,220,0.3);
}

button:active {
    transform: scale(0.98);
}

.footer-message {
    text-align: center;

    margin-top: 25px;

    color: #8995a6;

    font-size: 12px;
}

@media (max-width: 500px) {

    .login-container {
        padding: 28px 22px;

        border-radius: 25px;
    }

    .logo h1 {
        font-size: 26px;
    }

}</style>
</head>

<body>

    <div class="background-decoration decoration-1">✚</div>
    <div class="background-decoration decoration-2">♡</div>
    <div class="background-decoration decoration-3">✚</div>
    <div class="background-decoration decoration-4">☁</div>

    <main class="login-container">

        <div class="logo">
            <div class="logo-icon">
                🩺
            </div>

            <div>
                <h1>Sentinela</h1>
                <span>Hospital Kids</span>
            </div>
        </div>

        <div class="welcome">
            <h2>Olá! 👋</h2>

            <p>
                Entre no sistema para começar o atendimento.
            </p>
        </div>

        <div class="form">

            <label for="usuario">
                Usuário
            </label>

            <div class="input-box">
                <span>👤</span>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                >
            </div>

            <label for="senha">
                Senha
            </label>

            <div class="input-box">
                <span>🔐</span>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    onkeydown="if(event.key === 'Enter') login()"
                >
            </div>

            <button onclick="login()">
                Entrar no sistema 🚀
            </button>

        </div>

        <div class="footer-message">
            💙 Cuidando de cada paciente com carinho
        </div>

    </main>

    <script>

        async function login() {

            const usuario =
                document.getElementById("usuario").value.trim();

            const senha =
                document.getElementById("senha").value.trim();

            if (!usuario || !senha) {

                alert("Digite o usuário e a senha.");

                return;
            }

            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        usuario,
                        senha
                    })

                });

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.erro ||
                        "Usuário ou senha inválidos."
                    );

                }

                if (data.tipo === "triagem") {

                    window.location.href = "/triagem.html";

                } else if (data.tipo === "medico") {

                    window.location.href = "/medico.html";

                } else if (data.tipo === "atendimento") {

                    window.location.href = "/atendimento.html";

                } else {

                    alert("Tipo de usuário inválido.");

                }

            } catch (error) {

                console.error("Erro no login:", error);

                alert(
                    "Não foi possível conectar ao servidor.\n\n" +
                    error.message
                );

            }

        }

    </script>

</body>

</html>
