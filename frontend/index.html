<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Hospital</title>

    <link
        rel="stylesheet"
        href="css/index.css"
    >

</head>


<body>

    <div class="container">

        <h2>
            Sistema Hospitalar
        </h2>


        <input
            type="text"
            id="usuario"
            placeholder="Usuário"
        >


        <input
            type="password"
            id="senha"
            placeholder="Senha"
        >


        <button onclick="login()">
            Entrar
        </button>

    </div>


    <script>

        async function login() {

            const usuario =
                document
                    .getElementById("usuario")
                    .value
                    .trim();


            const senha =
                document
                    .getElementById("senha")
                    .value
                    .trim();


            if (!usuario || !senha) {

                alert(
                    "Digite o usuário e a senha."
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        "/login",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                usuario:
                                    usuario,

                                senha:
                                    senha

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.erro ||
                        "Usuário ou senha inválidos."
                    );

                }


                if (
                    data.tipo ===
                    "triagem"
                ) {

                    window.location.href =
                        "/triagem.html";

                }

                else if (
                    data.tipo ===
                    "medico"
                ) {

                    window.location.href =
                        "/medico.html";

                }

                else if (
                    data.tipo ===
                    "atendimento"
                ) {

                    window.location.href =
                        "/atendimento.html";

                }

                else {

                    alert(
                        "Tipo de usuário inválido."
                    );

                }


            } catch (error) {

                console.error(error);


                alert(
                    "Erro ao conectar com o servidor.\n\n" +
                    error.message
                );

            }

        }

    </script>

</body>

</html>
