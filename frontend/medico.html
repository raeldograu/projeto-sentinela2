<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Painel Médico
    </title>

    <link
        rel="stylesheet"
        href="css/medico.css"
    >

</head>


<body>

<div class="container">


    <header class="header">

        <div>

            <span class="subtitle">
                SISTEMA HOSPITALAR
            </span>

            <h1>
                🩺 Painel Médico
            </h1>

            <p>
                Pacientes aguardando atendimento
            </p>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            Sistema Online

        </div>

    </header>


    <section class="section">


        <div class="section-title">

            <div>

                <span class="tag">
                    ATENDIMENTO
                </span>

                <h2>
                    Pacientes para atender
                </h2>

            </div>


            <button
                class="refresh-btn"
                onclick="carregarPacientes()"
            >

                ↻ Atualizar

            </button>

        </div>


        <div
            id="triagem"
            class="triagem"
        ></div>


    </section>


    <footer>

        Sistema Hospitalar • Painel Médico

    </footer>


</div>


<script>

    async function carregarPacientes() {

        const div =
            document
                .getElementById(
                    "triagem"
                );


        div.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⏳
                </div>

                <h3>
                    Carregando pacientes...
                </h3>

            </div>

        `;


        try {

            const response =
                await fetch(
                    "/triagem"
                );


            if (!response.ok) {

                throw new Error(
                    "Erro ao carregar pacientes."
                );

            }


            const pacientes =
                await response.json();


            div.innerHTML = "";


            if (
                !Array.isArray(pacientes) ||
                pacientes.length === 0
            ) {

                div.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ✓
                        </div>

                        <h3>
                            Nenhum paciente aguardando
                        </h3>

                        <p>
                            Não existem pacientes
                            aguardando atendimento.
                        </p>

                    </div>

                `;

                return;

            }


            pacientes.forEach(
                paciente => {

                    const risco =
                        String(
                            paciente.risco ||
                            "verde"
                        ).toLowerCase();


                    let classeRisco =
                        "risco-verde";


                    if (
                        risco.includes(
                            "vermelho"
                        )
                    ) {

                        classeRisco =
                            "risco-vermelho";

                    }

                    else if (
                        risco.includes(
                            "amarelo"
                        )
                    ) {

                        classeRisco =
                            "risco-amarelo";

                    }

                    else if (
                        risco.includes(
                            "laranja"
                        )
                    ) {

                        classeRisco =
                            "risco-laranja";

                    }

                    else if (
                        risco.includes(
                            "azul"
                        )
                    ) {

                        classeRisco =
                            "risco-azul";

                    }


                    const nome =
                        paciente.nome ||
                        "Paciente";


                    const sintoma =
                        paciente.sintoma ||
                        "Não informado";


                    const temperatura =
                        paciente.temperatura !== null &&
                        paciente.temperatura !== undefined &&
                        paciente.temperatura !== ""
                            ? paciente.temperatura + " °C"
                            : "Não informada";


                    const alergias =
                        paciente.alergias ||
                        "Nenhuma";


                    const observacao =
                        paciente.observacao ||
                        "Nenhuma";


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "patient-card";


                    card.innerHTML = `

                        <div class="patient-top">

                            <div class="patient-avatar">

                                ${nome
                                    .charAt(0)
                                    .toUpperCase()}

                            </div>


                            <div class="patient-name">

                                <h3>
                                    ${nome}
                                </h3>

                                <span>
                                    Aguardando atendimento
                                </span>

                            </div>


                            <span
                                class="risk ${classeRisco}"
                            >

                                ${paciente.risco}

                            </span>

                        </div>


                        <div class="patient-info">

                            <div>

                                <span>
                                    Sintoma
                                </span>

                                <strong>
                                    ${sintoma}
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Temperatura
                                </span>

                                <strong>
                                    ${temperatura}
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Alergias
                                </span>

                                <strong>
                                    ${alergias}
                                </strong>

                            </div>

                        </div>


                        <div class="observation">

                            <strong>
                                Observações:
                            </strong>

                            <br><br>

                            ${observacao}

                        </div>


                        <button
                            class="attend-btn"
                            onclick="atenderPaciente(${paciente.id})"
                        >

                            🩺 Atender paciente

                        </button>

                    `;


                    div.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(
                error
            );


            div.innerHTML = `

                <div class="error">

                    ❌ Não foi possível
                    carregar os pacientes.

                    <br><br>

                    ${error.message}

                </div>

            `;

        }

    }


    function atenderPaciente(id) {

        if (!id) {

            alert(
                "Paciente inválido."
            );

            return;

        }


        window.location.href =
            `/consulta.html?id=${id}`;

    }


    carregarPacientes();

</script>

</body>

</html>
